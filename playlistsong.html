    <style>
      body {
        align-items: center;
        min-height: 100vh;
        margin: 0 auto;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Khung chứa các nút bấm */
      .playlist-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        max-width: 350px;
        padding: 20px;
      }

      /* Thiết kế chung cho các nút nhạc */
      .music-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px 24px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        transition: all 0.3s ease;
        text-align: left;
      }

      .music-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5);
      }

      .music-btn:active {
        transform: scale(0.98);
      }

      /* Đổi màu nút đang phát nhạc */
      .music-btn.playing {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5253 100%);
        box-shadow: 0 4px 15px rgba(238, 82, 83, 0.4);
      }

      /* Cắt gọn tên bài hát nếu quá dài */
      .btn-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 300;
        text-shadow: 1px 1px 1px cyan;
      }
    </style>

    <script>
      const audio = document.getElementById("main-audio");
      const buttons = document.querySelectorAll(".music-btn");
      let currentBtn = null; // Lưu nút đang phát hiện tại

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const songSrc = btn.getAttribute("data-src");
          const songTitle = btn.getAttribute("data-title");
          const icon = btn.querySelector(".btn-icon");
          const text = btn.querySelector(".btn-text");

          // Trường hợp 1: Nhấn vào chính nút đang phát/tạm dừng
          if (currentBtn === btn) {
            if (audio.paused) {
              audio.play();
              icon.textContent = "⏸";
              text.textContent = "Đang phát: " + songTitle;
              btn.classList.add("playing");
            } else {
              audio.pause();
              icon.textContent = "▶";
              text.textContent = songTitle;
              btn.classList.remove("playing");
            }
            return;
          }

          // Trường hợp 2: Nhấn sang một bài hát khác
          // Đặt lại trạng thái cho nút cũ (nếu có)
          if (currentBtn) {
            currentBtn.querySelector(".btn-icon").textContent = "▶";
            currentBtn.querySelector(".btn-text").textContent =
              currentBtn.getAttribute("data-title");
            currentBtn.classList.remove("playing");
          }

          // Cập nhật và phát bài mới
          currentBtn = btn;
          audio.src = songSrc;
          audio.play();
          icon.textContent = "⏸";
          text.textContent = "Đang phát: " + songTitle;
          btn.classList.add("playing");
        });
      });

      // Tự động đặt lại nút khi bài hát kết thúc
      audio.addEventListener("ended", () => {
        if (currentBtn) {
          currentBtn.querySelector(".btn-icon").textContent = "▶";
          currentBtn.querySelector(".btn-text").textContent =
            currentBtn.getAttribute("data-title");
          currentBtn.classList.remove("playing");
          currentBtn = null;
        }
      });
    </script>
