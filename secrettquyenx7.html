<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tquyen profile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        color: white;
        background-color: rgb(30, 28, 66);
      }
      /* 1 avatar */
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 1px solid;
        object-fit: cover;
        display: block;
        margin: 0 auto;
      }
      /* 2 profile-card */
      .profile-card {
        width: 370px;
        max-width: 100%;
        border-radius: 20px;
        background-color: rgb(124, 195, 195);
        padding: 24px;
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
      }
      /* text */
      h1 {
        margin: 10px 0 16px;
        font-size: 24px;
        line-height: 0.5;
        padding-top: 20px;
        text-align: center;
      }
      h3 {
        text-align: center;
        height: max-content;
        line-height: 0;
      }
      p {
        text-align: center;
      }
      .hobbies {
        font-size: 18px;
        margin: 14px 0 20px;
      }
      .hobbies a {
        text-decoration: none;
        color: white;
      }
      .description {
        text-align: 1.4;
        padding-top: 10px;
      }
      .social-button {
        display: flex;
        gap: 10px;
        width: 100%;
      }
      .social-button a {
        flex: 1;
        min-width: 0;
        padding: 12px 4px;
        text-decoration: none;
        text-shadow: 1 0 0 currentColor;
        color: white;
        font-style: sans-serif;
        background-color: #d54f4f;
        border-radius: 10px;
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        transition: 0.4s;
      }
      .social-button a:hover {
        background-color: rgb(64, 99, 130);
      }
      .tquyenanm-1 {
        animation: tquyenanm-run-1 3s ease-in-out infinite alternate-reverse;
      }
      @keyframes tquyenanm-run-1 {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(-125%);
          opacity: 1;
        }
      }
      .tquyenanm-2 {
        animation: tquyenanm-run-2 3s ease-in-out infinite alternate-reverse;
      }
      @keyframes tquyenanm-run-2 {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
        to {
          transform: translateX(125%);
          opacity: 1;
        }
      }
      .tquyenanm-1,
      .tquyenanm-2 {
        color: black;
        text-shadow: 1px 0 0px red;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: -1;
        font-size: 30px;
        font-style: sans-serif;
      }
      /* Tối ưu giao diện điện thoại */
      @media (max-width: 480px) {
        body {
          padding: 20px 12px;
          gap: 12px;
        }

        .profile-card {
          width: 100%;
          padding: 20px 16px;
          border-radius: 16px;
        }

        .avatar {
          width: 90px;
          height: 90px;
        }

        .profile-card h1 {
          font-size: 22px;
          line-height: 1;
          padding-top: 0;
          margin: 14px 0 8px;
          overflow-wrap: anywhere;
        }

        .profile-card h3 {
          line-height: 1;
          margin: 0;
        }

        .description {
          line-height: 1;
          padding-top: 8px;
          overflow-wrap: anywhere;
        }

        .hobbies {
          font-size: 15px;
          line-height: 1.5;
        }

        .social-button {
          gap: 8px;
        }

        .social-button a {
          font-size: 14px;
          padding: 12px 2px;
        }

        .tquyenanm-1,
        .tquyenanm-2 {
          font-size: clamp(16px, 4.5vw, 22px);
          max-width: 100%;
          text-align: center;
          line-height: 1;
        }
        @keyframes tquyenanm-run-1 {
          from {
            transform: translateX(35%);
            opacity: 0;
          }
          to {
            transform: translateX(-35%);
            opacity: 1;
          }
        }

        @keyframes tquyenanm-run-2 {
          from {
            transform: translateX(-35%);
            opacity: 0;
          }
          to {
            transform: translateX(35%);
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <h1 class="tquyenanm-1">Who is Tquyenx7</h1>
    <audio autoplay loop src="./media/tquyenpf.mp4"></audio>
    <div class="profile-card">
      <a href="./index2.html"><img src="./img/tquyen.jpg" class="avatar" /></a>
      <h1>Đặng Trọng Quyền</h1>
      <h3>(邓重权)</h3>
      <p class="description">

      </p>
      <p class="hobbies">
        🎮 Chơi game · <a href="./tquyenofcover.html">🎵Nghe nhạc ·</a> 💻 Lập
        trình
      </p>
      <div class="social-button">
        <a
          href="https://www.facebook.com/share/1EcqUTVa4V/?mibextid=wwXIfr"
          target="_blank"
          >Facebook</a
        >
        <a
          href="https://www.tiktok.com/@.12th123?_r=1&_t=ZS-9AiDSYHQwAq"
          target="_blank"
          >tiktok</a
        >
        <!-- <a href="" target="_blank"></a> -->
      </div>
    </div>
    <h1 class="tquyenanm-2">Who is Tquyenx7</h1>
  </body>
</html>
